
<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }
        .container {
            background: white;
            width: 350px;
            margin: 80px auto;
            padding: 20px;
            border-radius: 10px;
        }
        input {
            padding: 10px;
            width: 60%;
        }
        button {
            padding: 10px;
            cursor: pointer;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
        }
        ul {
            padding: 0;
        }
        li {
            list-style: none;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete {
            background: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>My To-Do List</h2>

        <input type="text" id="taskInput"
               placeholder="Enter a Task">
        <button onclick="addTask()">Add Task</button>
        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {

            let input = document.getElementById("taskInput");
            let task = input.value.trim();
            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            let li = document.createElement("li");
            li.innerHTML = task +
                '<button class="delete" onclick="this.parentElement.remove()">Delete</button>';

            document.getElementById("taskList").appendChild(li);
            input.value = "";
        }
    </script>

</body>
</html>
